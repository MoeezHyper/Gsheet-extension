<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sheets Row Focus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <h1>Sheets Row Focus</h1>
    <small id="version" class="version"></small>
  </header>

  <main>
    <label class="row switch-row">
      <span>
        <strong>Enable extension</strong>
        <small>Turn row focus on or off</small>
      </span>
      <input type="checkbox" id="enabled" role="switch">
    </label>

    <fieldset id="options">
      <section>
        <div class="row">
          <label for="scale"><strong>Row scale</strong></label>
          <output id="scaleValue" for="scale">120%</output>
        </div>
        <input type="range" id="scale" min="100" max="300" step="10" aria-describedby="scaleHelp">
        <small id="scaleHelp">100% shows the row at normal size.</small>
        <label class="row switch-row">
          <span>
            <strong>Make room for the row</strong>
            <small>Push the rows below down instead of covering them</small>
          </span>
          <input type="checkbox" id="pushRows" role="switch">
        </label>
        <label class="row switch-row">
          <span>
            <strong>Keep columns aligned</strong>
            <small>Enlarge each cell inside its own column</small>
          </span>
          <input type="checkbox" id="alignColumns" role="switch">
        </label>
      </section>

      <section>
        <label class="row switch-row">
          <span>
            <strong>Show header row</strong>
            <small>Column titles above the focused row</small>
          </span>
          <input type="checkbox" id="showHeader" role="switch">
        </label>
        <div id="headerOptions" class="row">
          <label for="headerRow">Header is row</label>
          <input type="number" id="headerRow" min="1" max="100000" step="1" inputmode="numeric">
        </div>
      </section>

      <section>
        <label class="row switch-row">
          <span><strong>Fill color</strong></span>
          <input type="checkbox" id="fillEnabled" role="switch">
        </label>
        <div id="fillOptions">
          <div class="row">
            <label for="fillColor">Color</label>
            <input type="color" id="fillColor">
          </div>
          <div class="swatches" role="group" aria-label="Preset colors">
            <button type="button" data-color="#fff59d" title="Yellow" style="background:#fff59d"></button>
            <button type="button" data-color="#a5d6a7" title="Green" style="background:#a5d6a7"></button>
            <button type="button" data-color="#90caf9" title="Blue" style="background:#90caf9"></button>
            <button type="button" data-color="#f48fb1" title="Pink" style="background:#f48fb1"></button>
            <button type="button" data-color="#ffcc80" title="Orange" style="background:#ffcc80"></button>
            <button type="button" data-color="#ce93d8" title="Purple" style="background:#ce93d8"></button>
          </div>
          <div class="row">
            <label for="fillOpacity">Strength</label>
            <output id="fillOpacityValue" for="fillOpacity">60%</output>
          </div>
          <input type="range" id="fillOpacity" min="10" max="100" step="5">
        </div>
      </section>
    </fieldset>

    <div class="row footer">
      <small>Click a row number (e.g. <b>1</b>) to focus that row.</small>
      <button type="button" id="reset" class="link">Reset</button>
    </div>
  </main>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
